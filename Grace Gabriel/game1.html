<!doctype html>
<html>
<head>
  <title>Memory Match | Snow Mountain Arcade</title>
  <link rel="stylesheet" href="game.css">
</head>
<body class="memory-page">
  <div class="site-header">
    <a class="site-title" href="index.html">Snow Mountain Arcade</a>

    <div class="site-nav">
      <a href="index.html">Home</a>
      <a href="game1.html" aria-current="page">Memory Match</a>
      <a href="game2.html">Snow Shot</a>
      <a href="quiz.html">Quiz</a>
    </div>
  </div>

  <div class="memory-game">
    <h1>Memory Match</h1>
    <p class="memory-intro">Flip two cards at a time. Find all eight pairs to win.</p>

    <div id="panel" class="memory-controls">
      <div class="memory-stats">
        <span>Score <span id="score" class="stat-number">0</span></span>
        <span>Pairs <span id="matched" class="stat-number">0</span> / 8</span>
      </div>

      <button class="memory-restart" type="button" onclick="reset()">Restart</button>
    </div>

    <div id="board" class="memory-board"></div>
    <p id="over" class="memory-result" aria-live="polite"></p>
  </div>

  <script>
    let icons = ["🎄", "🎅", "🦌", "🎁", "🍬", "⛄", "🌟", "🔔"];
    let deck = [];
    let score = 0;
    let matched = 0;
    let first = -1;
    let lock = false;
    let flipTimer;

    function buildBoard() {
      deck = icons.concat(icons);
      deck.sort(function () {
        return Math.random() - 0.5;
      });

      let html = "";
      for (let i = 0; i < deck.length; i++) {
        html = html + '<button type="button" class="card" id="card' + i + '" onclick="flip(' + i + ')" aria-label="Card ' + (i + 1) + '">?</button>';
      }
      document.getElementById("board").innerHTML = html;
    }

    function flip(i) {
      if (lock == true) return;
      if (i == first) return;

      let c = document.getElementById("card" + i);
      if (c.className == "card done") return;

      c.innerHTML = deck[i];
      c.setAttribute("aria-label", "Card " + (i + 1) + ": " + deck[i]);
      c.className = "card open";

      if (first == -1) {
        first = i;
        return;
      }

      lock = true;
      let j = first;

      if (deck[i] == deck[j]) {
        document.getElementById("card" + i).className = "card done";
        document.getElementById("card" + j).className = "card done";
        document.getElementById("card" + i).disabled = true;
        document.getElementById("card" + j).disabled = true;
        score = score + 10;
        matched = matched + 1;
        document.getElementById("score").innerHTML = score;
        document.getElementById("matched").innerHTML = matched;
        first = -1;
        lock = false;

        if (matched == 8) {
          document.getElementById("over").innerHTML = "You found all eight pairs!";
        }
      } else {
        flipTimer = setTimeout(function () {
          document.getElementById("card" + i).innerHTML = "?";
          document.getElementById("card" + j).innerHTML = "?";
          document.getElementById("card" + i).className = "card";
          document.getElementById("card" + j).className = "card";
          document.getElementById("card" + i).setAttribute("aria-label", "Card " + (i + 1));
          document.getElementById("card" + j).setAttribute("aria-label", "Card " + (j + 1));
          first = -1;
          lock = false;
        }, 800);
      }
    }

    function reset() {
      clearTimeout(flipTimer);
      score = 0;
      matched = 0;
      first = -1;
      lock = false;
      document.getElementById("score").innerHTML = score;
      document.getElementById("matched").innerHTML = matched;
      document.getElementById("over").innerHTML = "";
      buildBoard();
    }

    buildBoard();
  </script>
</body>
</html>
