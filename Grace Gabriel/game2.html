<!doctype html>
<html>
<head>
    <title>Snow Shot | Snow Mountain Arcade</title>
    <link rel="stylesheet" href="game.css">
</head>
<body class="snow-page">
    <div class="site-header">
        <a class="site-title" href="index.html">Snow Mountain Arcade</a>

        <div class="site-nav">
            <a href="index.html">Home</a>
            <a href="game1.html">Memory Match</a>
            <a href="game2.html" aria-current="page">Snow Shot</a>
            <a href="quiz.html">Quiz</a>
        </div>
    </div>

    <div class="snow-shot">
        <h1>Snow Shot</h1>
        <p class="game-intro">
            Adjust the exposure to 7 in three moves or fewer.
            Then take your photo to capture the snowy peak.
        </p>

        <div class="camera-layout">
            <div class="photo-area">
                <div class="viewfinder">
                    <div id="snow-photo" class="snow-photo dark"
                         role="img" aria-label="Snowy mountain camera preview"></div>
                    <span class="viewfinder-label" id="photo-label">Live Preview</span>
                    <div class="focus-box" aria-hidden="true"></div>
                </div>

                <div class="photo-picker">
                    <p>Choose a snow scene</p>

                    <div class="photo-options">
                        <button type="button" onclick="choosePhoto('snow-mountain.jpg')">
                            <img src="snow-mountain.jpg" alt="Snow scene 1">
                        </button>
                        <button type="button" onclick="choosePhoto('snow-2.jpg')">
                            <img src="snow-2.jpg" alt="Snow scene 2">
                        </button>
                        <button type="button" onclick="choosePhoto('snow-3.jpg')">
                            <img src="snow-3.jpg" alt="Snow scene 3">
                        </button>
                        <button type="button" onclick="choosePhoto('snow-4.jpg')">
                            <img src="snow-4.jpg" alt="Snow scene 4">
                        </button>
                        <button type="button" onclick="choosePhoto('snow-5.jpg')">
                            <img src="snow-5.jpg" alt="Snow scene 5">
                        </button>
                    </div>
                </div>
            </div>

            <div class="camera-panel">
                <div class="camera-stats">
                    <div class="stat">
                        Exposure
                        <span class="stat-number" id="exposure">0</span>
                    </div>
                    <div class="stat">
                        Target
                        <span class="stat-number">7</span>
                    </div>
                    <div class="stat">
                        Moves Left
                        <span class="stat-number" id="moves">3</span>
                    </div>
                </div>

                <div class="exposure-buttons">
                    <button id="plus-four" onclick="adjustExposure(4)">+4</button>
                    <button id="plus-two" onclick="adjustExposure(2)">+2</button>
                    <button id="minus-one" onclick="adjustExposure(-1)">−1</button>
                </div>

                <button id="shutter" class="shutter" onclick="takePhoto()">Take Photo</button>
                <p id="result" class="game-result" aria-live="polite">Adjust the exposure to begin.</p>
                <button class="restart" onclick="restartGame()">Restart</button>
            </div>
        </div>
    </div>

    <script>
        let exposure = 0;
        let movesLeft = 3;
        let gameOver = false;

        function updateScreen() {
            document.getElementById("exposure").textContent = exposure;
            document.getElementById("moves").textContent = movesLeft;

            if (exposure < 7) {
                document.getElementById("snow-photo").className = "snow-photo dark";
            } else if (exposure > 7) {
                document.getElementById("snow-photo").className = "snow-photo bright";
            } else {
                document.getElementById("snow-photo").className = "snow-photo";
            }

            document.getElementById("plus-four").disabled = movesLeft == 0 || gameOver;
            document.getElementById("plus-two").disabled = movesLeft == 0 || gameOver;
            document.getElementById("minus-one").disabled = movesLeft == 0 || gameOver;
            document.getElementById("shutter").disabled = gameOver;
        }

        function adjustExposure(amount) {
            if (gameOver == false && movesLeft > 0) {
                exposure = exposure + amount;
                movesLeft = movesLeft - 1;
                updateScreen();

                if (movesLeft == 0) {
                    document.getElementById("result").textContent =
                        "No moves left. Click Take Photo.";
                } else {
                    document.getElementById("result").textContent =
                        "Adjust again or take your photo.";
                }
            }
        }

        function takePhoto() {
            if (gameOver == false) {
                if (exposure == 7) {
                    document.getElementById("result").textContent =
                        "Perfect exposure! You captured the snowy peak.";
                } else if (exposure < 7) {
                    document.getElementById("result").textContent =
                        "Too dark! Click Restart to try again.";
                } else {
                    document.getElementById("result").textContent =
                        "Too bright! Click Restart to try again.";
                }

                gameOver = true;
                document.getElementById("photo-label").textContent = "Captured Photo";
                updateScreen();
            }
        }

        function restartGame() {
            exposure = 0;
            movesLeft = 3;
            gameOver = false;

            document.getElementById("photo-label").textContent = "Live Preview";
            document.getElementById("result").textContent = "Adjust the exposure to begin.";
            updateScreen();
        }

        function choosePhoto(fileName) {
            document.getElementById("snow-photo").style.backgroundImage = "url('" + fileName + "')";

            restartGame();
        }
    </script>
</body>
</html>
